spring:
  application:
    name: po-modernization

  datasource:
    url: jdbc:postgresql://localhost:5433/po_modernization
    username: wms
    password: wms123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        default_schema: dbo

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: dbo,public

server:
  port: 8080

# Temporal configuration
temporal:
  server:
    address: localhost:7233
  namespace: default
  task-queue: po-population-queue
  workflow:
    timeout-minutes: 30

# PO configuration
po:
  dualwrite:
    enabled: false
  default:
    version: V2

# Configuration path
config:
  base-path: classpath:config/

# Logging
logging:
  level:
    root: INFO
    com.wms.po: DEBUG
    io.temporal: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
