spring:
  application:
    name: po-modernization-local

  datasource:
    url: jdbc:h2:mem:podb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS dbo
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_schema: dbo

  sql:
    init:
      mode: never

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

server:
  port: 8080

# Temporal Configuration - Enabled for demo
temporal:
  enabled: true
  server:
    host: localhost
    port: 7233
  namespace: default
  task-queue: po-populate-queue
  finalize-task-queue: po-finalize-queue
  worker:
    enabled: true
  workflow:
    timeout-minutes: 30
    finalize-timeout-minutes: 60
  startup:
    retry-attempts: 10
    retry-delay-seconds: 3
    fail-on-error: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    com.wms.po: DEBUG
    io.temporal: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
