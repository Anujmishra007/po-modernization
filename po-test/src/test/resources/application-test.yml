spring:
  application:
    name: po-modernization-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

server:
  port: 0

temporal:
  server:
    address: localhost:7233
  namespace: default
  task-queue: test-task-queue

po:
  dualwrite:
    enabled: false
  default:
    version: V2

logging:
  level:
    root: WARN
    com.wms.po: DEBUG
