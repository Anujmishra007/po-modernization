# ═══════════════════════════════════════════════════════════════════════════
# PO Modernization - Pull Request Checks
# ═══════════════════════════════════════════════════════════════════════════
# Triggers: Pull Requests
# Runs: Build, Lint, Unit Tests, Code Coverage
# ═══════════════════════════════════════════════════════════════════════════

name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '17'
  # Use Node.js 24 for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Build Check
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw || true

      - name: Build
        run: mvn clean compile -DskipTests -B

  # ═══════════════════════════════════════════════════════════════════════════
  # Unit Tests with Coverage
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Tests & Coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build all modules (skip tests)
        run: mvn install -DskipTests -B

      - name: Run Tests with Coverage
        run: |
          # Run tests ONLY on specified modules (dependencies already built above)
          mvn test jacoco:report -B \
            -pl po-service,po-test \
            --fail-at-end || true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          flags: unittests
          fail_ci_if_error: false

      - name: Add Coverage PR Comment
        uses: madrapps/jacoco-report@v1.6
        with:
          paths: '**/target/site/jacoco/jacoco.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 80
          title: '📊 Code Coverage Report'
          update-comment: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Code Quality
  # ═══════════════════════════════════════════════════════════════════════════
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Check for Compile Errors
        run: mvn compile -B

      - name: Check Dependencies
        run: mvn dependency:analyze -B || true

  # ═══════════════════════════════════════════════════════════════════════════
  # PR Summary
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: PR Summary
    needs: [build, test, code-quality]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Post Summary
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
